# Zettelkasten Label Printer Configuration

# Printer settings
printer:
  model: "QL-810W"
  # Connection can be: usb://0x04f9:0x209b or tcp://192.168.1.100
  connection: "usb://0x04f9:0x209b"
  label_size: "62"  # Label width in mm (62mm continuous tape recommended)

# Font settings (H1 = title, H2 = author/source, body = quote text)
fonts:
  h1_size: 48  # Title font size
  h2_size: 32  # Author/source font size
  body_size: 24  # Body text font size
  page_size: 20  # Page number font size
  font_family: "Arial"  # Can be: Arial, Helvetica, Times, Courier

# Layout settings
layout:
  padding: 20  # Padding in pixels
  line_spacing: 1.2  # Line spacing multiplier
  max_label_height: 800  # Maximum label height in pixels (adjust based on needs)

# Data source paths
data_sources:
  zotero_export_folder: "~/Documents/Zotero-Exports"
  highlighted_export_folder: "~/Documents/Highlighted-Exports"

# Processing options
options:
  auto_print: false  # If true, automatically prints without preview
  save_preview: true  # Save preview images before printing
  preview_folder: "~/Documents/Label-Previews"
